<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Admin - Settings & Players</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <style>
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            min-height: 100vh;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
        }

        .control-box h2 {
            color: #4CAF50;
            margin: 0 0 15px 0;
            font-size: 1.1em;
        }

        .header-bar {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            grid-column: 1 / -1;
            margin-bottom: 10px;
        }

        .header-bar h1 {
            color: #4CAF50;
            margin: 0;
        }

        .header-bar .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            padding: 8px 16px;
            background: #4CAF50;
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-links a:hover {
            background: #45a049;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .button-row button {
            flex: 1;
            min-width: 100px;
        }

        .settings-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .settings-row label {
            color: #4CAF50;
            font-weight: bold;
            min-width: 120px;
        }

        .settings-row input,
        .settings-row select {
            flex: 1;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #fff;
        }

        .radio-group input[type="radio"] {
            cursor: pointer;
        }

        .players-list {
            max-height: 600px;
            overflow-y: auto;
            font-size: 0.85em;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            margin-bottom: 5px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }

        .player-name {
            flex: 1;
            font-weight: bold;
            color: #fff;
        }

        .player-prizes {
            display: flex;
            gap: 15px;
            margin-right: 10px;
            font-size: 0.8em;
        }

        .prize-badge {
            background: #FF9800;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        .prize-badge.house {
            background: #f44336;
        }

        .player-actions {
            display: flex;
            gap: 5px;
        }

        .player-actions button {
            padding: 4px 8px;
            font-size: 0.75em;
            min-width: auto;
        }

        .waiting {
            color: #999;
            text-align: center;
            padding: 20px;
            font-style: italic;
        }

        /* Dialog/Modal styles */
        .dialog {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }

        .dialog.show {
            display: flex;
        }

        .dialog-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }

        .dialog-header h2 {
            color: #4CAF50;
            margin: 0;
        }

        .dialog-close {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dialog-close:hover {
            background: #da190b;
        }

        .dialog-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .dialog-body input {
            padding: 8px 12px;
            background: #333;
            border: 2px solid #4CAF50;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        .dialog-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .dialog-footer button {
            padding: 10px 20px;
            font-size: 13px;
        }

        .prize-choice {
            display: flex;
            gap: 10px;
        }

        .prize-choice button {
            flex: 1;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .header-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1>⚙️ Admin Panel - Settings & Players</h1>
        <div class="nav-links">
            <a href="/caller.html">← Back to Caller</a>
        </div>
    </div>

    <div class="container">
        <!-- LEFT PANEL: Settings -->
        <div class="panel">
            <!-- Game Settings -->
            <div class="control-box">
                <h2>⚙️ Game Settings</h2>
                <div>
                    <label style="color: #4CAF50; margin-bottom: 10px; display: block;">Game Type:</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="gameType" value="90" checked>
                            90-Ball
                        </label>
                        <label>
                            <input type="radio" name="gameType" value="75">
                            75-Ball
                        </label>
                    </div>
                </div>
                <div class="settings-row">
                    <label for="delayInput">Delay (ms):</label>
                    <input type="number" id="delayInput" value="5000" min="100" max="60000">
                </div>
                <p style="color: #999; font-size: 0.9em; margin-top: 15px;">💡 Adjust these settings before starting a new game. Once a game is running, these cannot be changed.</p>
            </div>
        </div>

        <!-- RIGHT PANEL: Players -->
        <div class="panel">
            <!-- Players & Prizes -->
            <div class="control-box">
                <h2>🎟️ Players & Prizes</h2>
                <div class="button-row">
                    <button id="addPlayerBtn" class="btn-primary">➕ Add Player</button>
                    <button id="resetPlayersBtn" class="btn-danger" style="flex: 0.5;">🔄 Reset</button>
                </div>
                <div class="players-list" id="playersList">
                    <div class="waiting">No players added yet</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Player Dialog -->
    <div id="addPlayerDialog" class="dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2>Add Player</h2>
                <button class="dialog-close" onclick="closeAddPlayerDialog()">✕</button>
            </div>
            <div class="dialog-body">
                <input type="text" id="playerNameInput" placeholder="Enter player name" maxlength="50">
            </div>
            <div class="dialog-footer">
                <button class="btn-success" onclick="confirmAddPlayer()">Add</button>
                <button class="btn-primary" onclick="closeAddPlayerDialog()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Prize Dialog -->
    <div id="addPrizeDialog" class="dialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 id="prizeDialogTitle">Add Prize</h2>
                <button class="dialog-close" onclick="closeAddPrizeDialog()">✕</button>
            </div>
            <div class="dialog-body">
                <p style="color: #ccc; margin: 0;">Select prize type:</p>
            </div>
            <div class="dialog-footer prize-choice">
                <button class="btn-warning" onclick="confirmAddPrize('line')">🎁 Line Prize</button>
                <button class="btn-danger" onclick="confirmAddPrize('house')">🏠 House Prize</button>
            </div>
        </div>
    </div>

    <script src="/shared/bingo-data.js"></script>
    <script src="/shared/client-id.js"></script>
    <script src="/shared/sse-client.js"></script>
    <script>
        // Admin page state
        let currentGame = null;
        let players = [];
        let selectedPlayerForPrize = null;
        const clientId = getClientId();
        let sseClient = null;

        // Initialize admin
        function initAdmin() {
            setupEventListeners();
            connectToServer();
            loadPlayers();
        }

        // Connect to server for game state updates
        function connectToServer() {
            sseClient = new SSEClient(clientId, 'admin', onStateUpdate);
            sseClient.connect();
        }

        // Handle state updates
        function onStateUpdate(payload) {
            currentGame = payload.game;
            updateGameSettings();
        }

        // Setup button handlers
        function setupEventListeners() {
            document.getElementById('addPlayerBtn').addEventListener('click', openAddPlayerDialog);
            document.getElementById('resetPlayersBtn').addEventListener('click', resetPlayers);

            // Dialog close on outside click
            document.getElementById('addPlayerDialog').addEventListener('click', (e) => {
                if (e.target.id === 'addPlayerDialog') closeAddPlayerDialog();
            });
            document.getElementById('addPrizeDialog').addEventListener('click', (e) => {
                if (e.target.id === 'addPrizeDialog') closeAddPrizeDialog();
            });

            // Enter key in player name input
            document.getElementById('playerNameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') confirmAddPlayer();
            });
        }

        // Update game settings UI based on current game state
        function updateGameSettings() {
            if (!currentGame) return;

            // Disable settings if game is running
            const gameRunning = currentGame.gameRunning;
            document.querySelectorAll('input[name="gameType"]').forEach((r) => {
                r.disabled = gameRunning;
            });
            document.getElementById('delayInput').disabled = gameRunning;

            // Set current values
            document.querySelector(`input[name="gameType"][value="${currentGame.gameType}"]`).checked = true;
            document.getElementById('delayInput').value = currentGame.delayMs;
        }

        // ===== PLAYER MANAGEMENT =====

        // Load players from server
        async function loadPlayers() {
            try {
                const res = await fetch('/api/players');
                if (res.ok) {
                    players = await res.json();
                    updatePlayersList();
                }
            } catch (err) {
                console.error('Error loading players:', err);
            }
        }

        // Update players list display
        function updatePlayersList() {
            const container = document.getElementById('playersList');

            if (players.length === 0) {
                container.innerHTML = '<div class="waiting">No players added yet</div>';
                return;
            }

            container.innerHTML = players
                .map(
                    (player) => `
                <div class="player-item">
                    <div class="player-name">${player.name}</div>
                    <div class="player-prizes">
                        <div class="prize-badge" title="Line Prizes">L: ${player.lineCount || 0}</div>
                        <div class="prize-badge house" title="House Prizes">H: ${player.houseCount || 0}</div>
                    </div>
                    <div class="player-actions">
                        <button class="btn-warning" onclick="openAddPrizeDialog('${player.id}', '${player.name}')">🎁</button>
                        <button class="btn-danger" onclick="deletePlayer('${player.id}')">✕</button>
                    </div>
                </div>
            `
                )
                .join('');
        }

        // Open add player dialog
        function openAddPlayerDialog() {
            document.getElementById('playerNameInput').value = '';
            document.getElementById('addPlayerDialog').classList.add('show');
            document.getElementById('playerNameInput').focus();
        }

        // Close add player dialog
        function closeAddPlayerDialog() {
            document.getElementById('addPlayerDialog').classList.remove('show');
        }

        // Confirm add player
        async function confirmAddPlayer() {
            const name = document.getElementById('playerNameInput').value.trim();
            if (!name) {
                alert('Please enter a player name');
                return;
            }

            try {
                const res = await postAction('/api/players', { name });
                players.push(res);
                updatePlayersList();
                closeAddPlayerDialog();
            } catch (err) {
                alert('Error adding player: ' + err.message);
            }
        }

        // Delete player
        async function deletePlayer(playerId) {
            if (!confirm('Delete this player?')) return;

            try {
                const res = await fetch(`/api/players/${playerId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete player');
                players = players.filter((p) => p.id !== playerId);
                updatePlayersList();
            } catch (err) {
                alert('Error deleting player: ' + err.message);
            }
        }

        // Open add prize dialog
        function openAddPrizeDialog(playerId, playerName) {
            selectedPlayerForPrize = playerId;
            document.getElementById('prizeDialogTitle').textContent = `Add Prize for ${playerName}`;
            document.getElementById('addPrizeDialog').classList.add('show');
        }

        // Close add prize dialog
        function closeAddPrizeDialog() {
            document.getElementById('addPrizeDialog').classList.remove('show');
            selectedPlayerForPrize = null;
        }

        // Confirm add prize
        async function confirmAddPrize(prizeType) {
            if (!selectedPlayerForPrize) return;

            try {
                const res = await postAction(`/api/players/${selectedPlayerForPrize}/prize`, { prizeType });
                // Update the player in our list
                const idx = players.findIndex((p) => p.id === selectedPlayerForPrize);
                if (idx >= 0) {
                    players[idx] = res;
                    updatePlayersList();
                }
                closeAddPrizeDialog();
            } catch (err) {
                alert('Error adding prize: ' + err.message);
            }
        }

        // Reset all players
        async function resetPlayers() {
            if (!confirm('Reset all players? This cannot be undone.')) return;

            try {
                await postAction('/api/players/reset', {});
                players = [];
                updatePlayersList();
            } catch (err) {
                alert('Error resetting players: ' + err.message);
            }
        }

        // Start on load
        window.addEventListener('DOMContentLoaded', initAdmin);
    </script>
</body>
</html>
