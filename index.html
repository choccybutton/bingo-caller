<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Caller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #fff;
            height: 100vh;
            padding: 10px;
            margin: 0;
            overflow: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: #2a2a2a;
            border-radius: 0;
            padding: 10px;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            gap: 8px;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            font-size: 1.6em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin: 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            margin: 0;
            flex: 1;
        }

        .fullscreen-btn {
            background: #9C27B0;
            padding: 8px 16px;
            font-size: 12px;
        }

        .fullscreen-btn:hover {
            background: #7B1FA2;
            transform: translateY(-2px);
        }

        body.fullscreen-mode {
            overflow: hidden;
        }

        body.fullscreen-mode .container {
            max-width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 10px;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        body.fullscreen-mode .header {
            margin-bottom: 10px;
        }

        body.fullscreen-mode h1 {
            font-size: 1.5em;
            margin: 0;
        }

        body.fullscreen-mode .top-bar {
            margin-bottom: 10px;
            padding: 10px;
        }

        body.fullscreen-mode .controls-group button {
            padding: 8px 12px !important;
            font-size: 14px !important;
        }

        body.fullscreen-mode .icon-btn {
            min-width: 40px;
        }

        body.fullscreen-mode .last-called-mini {
            padding: 8px 12px !important;
            font-size: 12px;
        }

        body.fullscreen-mode .last-called-mini div:first-child {
            font-size: 9px;
        }

        body.fullscreen-mode .last-called-mini div:nth-child(2) {
            font-size: 18px;
        }

        body.fullscreen-mode .last-called-mini div:last-child {
            font-size: 9px;
        }

        body.fullscreen-mode .status-bar {
            margin-bottom: 10px;
            padding: 10px;
        }

        body.fullscreen-mode .last-number-display {
            margin-bottom: 15px;
            padding: 15px;
        }

        body.fullscreen-mode .last-number {
            font-size: 36px;
        }

        body.fullscreen-mode .last-number-name {
            font-size: 14px;
        }

        body.fullscreen-mode .grid-container {
            flex: 1;
            margin-bottom: 10px;
            overflow: hidden;
        }

        body.fullscreen-mode .grid-container h3 {
            margin-top: 0;
            font-size: 12px;
        }

        body.fullscreen-mode .number-grid {
            grid-template-columns: repeat(auto-fit, minmax(55px, 1fr));
            grid-auto-rows: 1fr;
            gap: 7px;
            padding: 0;
        }

        body.fullscreen-mode .ball {
            font-size: clamp(16px, 2.5vw, 22px);
            min-width: 55px;
            min-height: 55px;
            border: 2px solid rgba(0, 0, 0, 0.3);
        }

        body.fullscreen-mode .last-five-container {
            margin-top: auto;
            padding: 10px;
        }

        body.fullscreen-mode .last-five-container h3 {
            font-size: 12px;
            margin-bottom: 8px;
        }

        body.fullscreen-mode .last-five-ball {
            min-width: 70px;
            width: 70px;
            height: 70px;
            font-size: 16px;
        }

        .control-panel {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #4CAF50;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-group label {
            font-weight: bold;
            color: #4CAF50;
            min-width: 100px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #fff;
            font-weight: normal;
        }

        .radio-group input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 8px 12px;
            background: #333;
            border: 2px solid #4CAF50;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #45a049;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            white-space: nowrap;
        }

        .btn-success {
            background: #4CAF50;
        }

        .btn-success:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .btn-primary {
            background: #2196F3;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.3);
        }

        .btn-warning {
            background: #FF9800;
        }

        .btn-warning:hover:not(:disabled) {
            background: #e68900;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-danger:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
            flex-wrap: wrap;
            gap: 10px;
            flex-shrink: 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-label {
            color: #999;
            font-weight: bold;
        }

        .status-value {
            color: #4CAF50;
            font-weight: bold;
            font-size: 18px;
        }

        .last-number-display {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            padding: 10px 12px;
            border-radius: 6px;
            text-align: center;
            border: 2px solid #4CAF50;
            flex-shrink: 0;
        }

        .last-number-display h2 {
            font-size: 10px;
            color: #ddd;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .last-number {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }

        .last-number-name {
            font-size: 12px;
            color: #e0e0e0;
            margin-top: 4px;
            font-style: italic;
        }

        .grid-container {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #333;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            height: 100%;
        }

        .grid-container h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
            font-size: 14px;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            grid-auto-rows: 1fr;
            gap: 6px;
            padding: 0;
            flex: 1;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        .ball {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(10px, 2.5vw, 18px);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            border: 1px solid rgba(0, 0, 0, 0.3);
            min-width: 40px;
            min-height: 40px;
        }

        .ball.uncalled {
            color: #555;
        }

        .ball.called {
            color: #fff;
            transform: scale(1.08);
        }

        .ball:hover:not(.called) {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .last-five-container {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #333;
        }

        .last-five-container h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .last-five-numbers {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .separator {
            height: 1px;
            background: #4CAF50;
            margin: 10px 0;
        }

        .info-message {
            background: #2196F3;
            color: #fff;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid #4CAF50;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #4CAF50;
            margin: 0;
        }

        .close-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #da190b;
            transform: scale(1.05);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-settings {
            background: #2196F3;
            padding: 10px 20px;
        }

        .btn-settings:hover {
            background: #0b7dda;
            transform: translateY(-2px);
        }

        .icon-btn {
            padding: 10px 14px !important;
            font-size: 16px !important;
            min-width: 44px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-bar {
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .controls-group {
            display: flex;
            gap: 8px;
        }

        .last-called-mini {
            flex-shrink: 0;
        }

        .last-five-mini {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-modal-close {
            background: #666;
            padding: 10px 20px;
        }

        .btn-modal-close:hover {
            background: #777;
            transform: translateY(-2px);
        }

        /* Enhanced Ball Styles */
        .ball {
            position: relative;
            background: radial-gradient(circle at 30% 30%, #555, #333);
            box-shadow:
                inset -2px -2px 4px rgba(0, 0, 0, 0.5),
                inset 2px 2px 4px rgba(255, 255, 255, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .ball.called {
            background: radial-gradient(circle at 30% 30%, #7FD856, #4CAF50);
            box-shadow:
                inset -2px -2px 4px rgba(0, 0, 0, 0.3),
                inset 2px 2px 4px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(76, 175, 80, 0.8),
                0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .last-five-ball {
            position: relative;
            background: radial-gradient(circle at 30% 30%, #64B5F6, #2196F3);
            box-shadow:
                inset -2px -2px 4px rgba(0, 0, 0, 0.3),
                inset 2px 2px 4px rgba(255, 255, 255, 0.2),
                0 0 20px rgba(33, 150, 243, 0.6),
                0 6px 12px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0 !important;
            min-width: 60px !important;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none !important;
        }

        @media (max-width: 768px) {
            .control-row {
                flex-direction: column;
                gap: 15px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: auto;
            }

            .status-bar {
                flex-direction: column;
                gap: 10px;
            }

            .number-grid {
                grid-template-columns: repeat(auto-fit, minmax(32px, 1fr));
                grid-auto-rows: 1fr;
                gap: 4px;
                padding: 0;
                height: 100%;
                width: 100%;
            }

            .ball {
                font-size: clamp(8px, 2vw, 13px);
                min-width: 32px;
                min-height: 32px;
                border: 1px solid rgba(0, 0, 0, 0.3);
            }

            .last-number {
                font-size: 36px;
            }

            h1 {
                font-size: 1.4em;
            }

            .modal-content {
                max-width: 90%;
                padding: 20px;
            }

            .top-bar {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .controls-group {
                width: 100%;
                justify-content: center;
            }

            .last-called-mini {
                min-width: 100px;
                font-size: 14px;
            }

            .last-five-mini {
                width: 100%;
                justify-content: center;
            }

            body.fullscreen-mode .number-grid {
                grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            }

            body.fullscreen-mode .ball {
                width: 65px;
                height: 65px;
                font-size: 16px;
            }
        }

        .spinner {
            border: 3px solid #444;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Scues Bingo Night</h1>
            <button id="fullscreenBtn" class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="close-btn" onclick="closeSettingsModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="control-group">
                        <label style="display: block; margin-bottom: 10px;">Game Type:</label>
                        <div class="radio-group" style="flex-direction: column; gap: 10px;">
                            <label>
                                <input type="radio" name="gameType" value="75">
                                75 Ball (American)
                            </label>
                            <label>
                                <input type="radio" name="gameType" value="90" checked>
                                90 Ball (British)
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="delayInput" style="display: block; margin-bottom: 10px;">Delay Between Calls (milliseconds):</label>
                        <input type="number" id="delayInput" value="5000" min="100" max="60000" style="width: 100%;">
                        <small style="color: #999; margin-top: 5px; display: block;">Minimum: 100ms | Maximum: 60,000ms | Default: 5,000ms</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-success" onclick="closeSettingsModal()">Done</button>
                </div>
            </div>
        </div>

        <!-- Main Controls and Display Line -->
        <div class="top-bar" style="display: flex; gap: 15px; align-items: center; justify-content: space-between;">
            <!-- Left Controls -->
            <div class="controls-group-left" style="display: flex; gap: 10px; align-items: center;">
                <button id="playPauseBtn" class="btn-success icon-btn" title="Play" style="padding: 10px 14px; font-size: 16px;">▶️</button>
                <button id="callBtn" class="btn-primary icon-btn" title="Call Number" style="padding: 10px 14px; font-size: 16px;">⏭</button>
                <button id="muteBtn" class="btn-primary icon-btn" title="Mute" style="padding: 10px 14px; font-size: 16px;">🔊</button>
            </div>

            <!-- Center Display -->
            <div style="display: flex; gap: 15px; align-items: center; flex: 1; justify-content: center;">
                <!-- Number Called -->
                <div class="last-called-mini" style="background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); padding: 25px 40px; border-radius: 6px; border: 2px solid #4CAF50; min-width: 220px; text-align: center;">
                    <div style="font-size: 16px; color: #ddd; text-transform: uppercase;">Called</div>
                    <div style="font-size: 144px; font-weight: bold; color: #fff; line-height: 1;" id="lastNumberMini">---</div>
                    <div style="font-size: 18px; color: #e0e0e0; font-style: italic;" id="lastNumberNameMini"></div>
                </div>

                <!-- Last 5 Numbers -->
                <div class="last-five-mini" style="display: flex; gap: 12px; align-items: center;">
                    <div style="font-size: 12px; color: #999; font-weight: bold; text-transform: uppercase;">Last 5:</div>
                    <div id="lastFiveNumbersMini" style="display: flex; gap: 10px;">
                        <span style="color: #999;">---</span>
                    </div>
                </div>
            </div>

            <!-- Right Controls -->
            <div class="controls-group-right" style="display: flex; gap: 10px;">
                <button id="resetBtn" class="btn-danger icon-btn" title="Reset" style="padding: 10px 14px; font-size: 16px;">🔄</button>
                <button id="settingsBtn" class="btn-settings icon-btn" onclick="openSettingsModal()" title="Settings" style="padding: 10px 14px; font-size: 16px;">⚙️</button>
            </div>
        </div>

        <div class="grid-container">
            <h3 style="color: #4CAF50; margin-bottom: 15px;">Numbers</h3>
            <div class="number-grid" id="numberGrid"></div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="status">Ready</span>
            </div>
            <div class="status-item">
                <span class="status-label">Called:</span>
                <span class="status-value" id="calledCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Remaining:</span>
                <span class="status-value" id="remainingCount">0</span>
            </div>
        </div>

    </div>

    <script>
        function openSettingsModal() {
            const modal = document.getElementById('settingsModal');
            if (modal) {
                modal.classList.add('show');
                console.log('Settings modal opened');
            }
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settingsModal');
            if (modal) {
                modal.classList.remove('show');
                console.log('Settings modal closed');
            }
        }

        function toggleFullscreen() {
            const body = document.body;
            const btn = document.getElementById('fullscreenBtn');

            if (body.classList.contains('fullscreen-mode')) {
                body.classList.remove('fullscreen-mode');
                btn.textContent = '⛶ Fullscreen';
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            } else {
                body.classList.add('fullscreen-mode');
                btn.textContent = '⛶ Exit';

                // Try to request fullscreen if available
                const container = document.querySelector('.container');
                if (container?.requestFullscreen) {
                    container.requestFullscreen().catch(() => {
                        // Fullscreen API not available, just use CSS fullscreen
                    });
                }
            }
        }

        // Handle Escape key to exit fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.body.classList.contains('fullscreen-mode')) {
                toggleFullscreen();
            }
        });

        // Close modal when clicking outside of it
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('settingsModal');
            if (event.target === modal) {
                closeSettingsModal();
            }
        });

        // Ensure modal and buttons are properly set up
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('settingsModal');
            if (modal) {
                console.log('Settings modal element found');
            }

            // Use event delegation for radio buttons
            document.addEventListener('change', (e) => {
                if (e.target.name === 'gameType') {
                    const gameType = parseInt(e.target.value);
                    if (window.bingoCaller) {
                        window.bingoCaller.gameType = gameType;
                        console.log('Game type changed to:', gameType);
                    }
                }
            });
        });

        const BINGO_NAMES = {
            1: "Kelly's eye",
            2: "One little duck",
            3: "Cup of tea",
            4: "Knock at the door",
            5: "Man alive",
            6: "Tom mix",
            7: "Lucky seven",

        class BingoCaller {
            constructor() {
                this.gameType = 90;
                this.gameRunning = false;
                this.gamePlaying = false;
                this.muted = false;
                this.speechPlaying = false;
                this.numbers = [];
                this.calledNumbers = [];
                this.lastFiveNumbers = [];
                this.autoTimer = null;
                this.setupEventListeners();
            }

            setupEventListeners() {
                const playPauseBtn = document.getElementById('playPauseBtn');
                const callBtn = document.getElementById('callBtn');
                const muteBtn = document.getElementById('muteBtn');
                const resetBtn = document.getElementById('resetBtn');

                if (playPauseBtn) playPauseBtn.addEventListener('click', () => {
                    console.log('Play/Pause clicked');
                    if (!this.gameRunning) {
                        this.startGame();
                    } else {
                        this.togglePlayPause();
                    }
                });
                if (callBtn) callBtn.addEventListener('click', () => {
                    if (!this.gameRunning) {
                        console.log('Call Number clicked before game started - starting game paused');
                        this.startGame(false);
                    }
                    this.callNumber();
                });
                if (muteBtn) muteBtn.addEventListener('click', () => this.toggleMute());
                if (resetBtn) resetBtn.addEventListener('click', () => this.reset());

                // Add window resize listener to update grid when page is resized
                window.addEventListener('resize', () => {
                    if (this.gameRunning) {
                        this.renderGrid();
                    }
                });

                console.log('Event listeners attached to main buttons');
                // Radio button listeners are now handled via event delegation in DOMContentLoaded
            }

            startGame(autoPlay = true) {
                try {
                    console.log('Starting game with type:', this.gameType, 'autoPlay:', autoPlay);

                    this.gameRunning = true;
                    this.gamePlaying = autoPlay;
                    this.calledNumbers = [];
                    this.lastFiveNumbers = [];
                    this.numbers = this.shuffleArray(Array.from({length: this.gameType}, (_, i) => i + 1));

                    console.log('Numbers generated:', this.numbers.length);

                    this.updateUI();
                    this.renderGrid();

                    const playPauseBtn = document.getElementById('playPauseBtn');
                    const statusEl = document.getElementById('status');
                    if (autoPlay) {
                        if (playPauseBtn) {
                            playPauseBtn.textContent = '⏸';
                            playPauseBtn.title = 'Pause';
                        }
                    } else {
                        if (playPauseBtn) {
                            playPauseBtn.textContent = '▶️';
                            playPauseBtn.title = 'Play';
                        }
                        if (statusEl) statusEl.textContent = 'Paused';
                    }

                    document.querySelectorAll('input[name="gameType"]').forEach(r => r.disabled = true);

                    const delayInput = document.getElementById('delayInput');
                    if (delayInput) delayInput.disabled = true;

                    const callBtn = document.getElementById('callBtn');
                    if (callBtn) callBtn.disabled = false;

                    console.log('Game started successfully');

                    if (autoPlay) {
                        this.startAutoMode();
                    }
                } catch (error) {
                    console.error('Error starting game:', error);
                }
            }

            callNumber() {
                // Don't call next number if speech is still playing
                if (this.speechPlaying) {
                    console.log('Speech still playing, ignoring call');
                    return;
                }

                if (!this.gameRunning || this.calledNumbers.length >= this.numbers.length) {
                    return;
                }

                const remainingNumbers = this.numbers.filter(n => !this.calledNumbers.includes(n));
                if (remainingNumbers.length === 0) {
                    const statusEl = document.getElementById('status');
                    if (statusEl) statusEl.textContent = 'Game Complete!';
                    const callBtn = document.getElementById('callBtn');
                    if (callBtn) callBtn.disabled = true;
                    return;
                }

                const number = remainingNumbers[Math.floor(Math.random() * remainingNumbers.length)];
                this.calledNumbers.push(number);

                this.updateUI();
                this.renderGrid();
                this.speakNumber(number);

                if (this.calledNumbers.length === this.numbers.length) {
                    if (this.autoTimer) {
                        clearInterval(this.autoTimer);
                    }
                    const statusEl = document.getElementById('status');
                    if (statusEl) statusEl.textContent = 'Game Complete!';
                    const callBtn = document.getElementById('callBtn');
                    if (callBtn) callBtn.disabled = true;
                }
            }

            togglePlayPause() {
                this.gamePlaying = !this.gamePlaying;

                const playPauseBtn = document.getElementById('playPauseBtn');
                const statusEl = document.getElementById('status');

                if (this.gamePlaying) {
                    if (playPauseBtn) {
                        playPauseBtn.textContent = '⏸';
                        playPauseBtn.title = 'Pause';
                    }
                    if (statusEl) statusEl.textContent = 'Playing';
                    this.startAutoMode();
                } else {
                    if (playPauseBtn) {
                        playPauseBtn.textContent = '▶️';
                        playPauseBtn.title = 'Play';
                    }
                    if (statusEl) statusEl.textContent = 'Paused';
                    if (this.autoTimer) {
                        clearInterval(this.autoTimer);
                    }
                }
            }

            toggleMute() {
                this.muted = !this.muted;

                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) {
                    if (this.muted) {
                        muteBtn.textContent = '🔇';
                        muteBtn.title = 'Unmute';
                        muteBtn.style.opacity = '0.6';
                    } else {
                        muteBtn.textContent = '🔊';
                        muteBtn.title = 'Mute';
                        muteBtn.style.opacity = '1';
                    }
                }
                console.log('Mute toggled:', this.muted);
            }

            startAutoMode() {
                // Clear any existing timer first
                if (this.autoTimer) {
                    clearInterval(this.autoTimer);
                }

                const delay = parseInt(document.getElementById('delayInput').value) || 5000;
                this.autoTimer = setInterval(() => {
                    // Only call next number if game is playing and no speech is currently playing
                    if (this.gamePlaying && this.gameRunning && !this.speechPlaying) {
                        this.callNumber();
                    }
                }, delay);
            }

            reset() {
                if (this.autoTimer) {
                    clearInterval(this.autoTimer);
                }

                this.gameRunning = false;
                this.gamePlaying = false;
                this.muted = false;
                this.numbers = [];
                this.calledNumbers = [];

                const numberGrid = document.getElementById('numberGrid');
                if (numberGrid) numberGrid.innerHTML = '';

                const lastNumberMini = document.getElementById('lastNumberMini');
                if (lastNumberMini) lastNumberMini.textContent = '---';

                const lastNumberNameMini = document.getElementById('lastNumberNameMini');
                if (lastNumberNameMini) lastNumberNameMini.textContent = '';

                const lastFiveNumbersMini = document.getElementById('lastFiveNumbersMini');
                if (lastFiveNumbersMini) lastFiveNumbersMini.innerHTML = '<span style="color: #999;">---</span>';

                const playPauseBtn = document.getElementById('playPauseBtn');
                if (playPauseBtn) {
                    playPauseBtn.disabled = false;
                    playPauseBtn.textContent = '▶️';
                    playPauseBtn.title = 'Play';
                }

                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) {
                    muteBtn.textContent = '🔊';
                    muteBtn.title = 'Mute';
                    muteBtn.style.opacity = '1';
                }

                document.querySelectorAll('input[name="gameType"]').forEach(r => r.disabled = false);

                const delayInput = document.getElementById('delayInput');
                if (delayInput) delayInput.disabled = false;

                const callBtn = document.getElementById('callBtn');
                if (callBtn) callBtn.disabled = false;

                const statusEl = document.getElementById('status');
                if (statusEl) statusEl.textContent = 'Ready';

                const calledCount = document.getElementById('calledCount');
                if (calledCount) calledCount.textContent = '0';

                const remainingCount = document.getElementById('remainingCount');
                if (remainingCount) remainingCount.textContent = '0';
            }

            renderGrid() {
                try {
                    const grid = document.getElementById('numberGrid');
                    if (!grid) {
                        console.error('Grid element not found');
                        return;
                    }

                    grid.innerHTML = '';

                    for (let i = 1; i <= this.gameType; i++) {
                        const ball = document.createElement('div');
                        ball.className = 'ball';
                        ball.textContent = i;

                        if (this.calledNumbers.includes(i)) {
                            ball.classList.add('called');
                        } else {
                            ball.classList.add('uncalled');
                        }

                        grid.appendChild(ball);
                    }
                    console.log('Grid rendered with', this.gameType, 'balls');
                } catch (error) {
                    console.error('Error rendering grid:', error);
                }
            }

            updateUI() {
                try {
                    const lastCalled = this.calledNumbers[this.calledNumbers.length - 1];
                    if (lastCalled) {
                        const lastNumberMiniEl = document.getElementById('lastNumberMini');
                        const lastNumberNameMiniEl = document.getElementById('lastNumberNameMini');

                        if (lastNumberMiniEl) lastNumberMiniEl.textContent = lastCalled;
                        if (lastNumberNameMiniEl) lastNumberNameMiniEl.textContent = `"${BINGO_NAMES[lastCalled]}"`;
                    }

                    // Calculate last 5 numbers (excluding current)
                    this.lastFiveNumbers = this.calledNumbers.slice(-6, -1).reverse();

                    const calledCountEl = document.getElementById('calledCount');
                    const remainingCountEl = document.getElementById('remainingCount');
                    const statusEl = document.getElementById('status');

                    if (calledCountEl) calledCountEl.textContent = this.calledNumbers.length;
                    if (remainingCountEl) remainingCountEl.textContent = this.gameType - this.calledNumbers.length;

                    if (this.gamePlaying && this.gameRunning && this.calledNumbers.length < this.gameType) {
                        if (statusEl) statusEl.textContent = 'Playing';
                    }

                    const lastFiveMiniContainer = document.getElementById('lastFiveNumbersMini');

                    if (lastFiveMiniContainer) {
                        if (this.lastFiveNumbers.length === 0) {
                            lastFiveMiniContainer.innerHTML = '<span style="color: #999;">---</span>';
                        } else {
                            lastFiveMiniContainer.innerHTML = this.lastFiveNumbers.map(n =>
                                `<span style="background: #2196F3; color: white; padding: 16px 32px; border-radius: 10px; font-weight: bold; font-size: 72px;">${n}</span>`
                            ).join('');
                        }
                    }
                } catch (error) {
                    console.error('Error updating UI:', error);
                }
            }

            speakNumber(number) {
                // If muted, don't speak but still mark as "done" with speech
                if (this.muted) {
                    return;
                }

                try {
                    const name = BINGO_NAMES[number];

                    // Try to get a better voice if available
                    const voices = window.speechSynthesis.getVoices();
                    let selectedVoice = null;

                    // Try to find an English voice with good quality
                    for (let voice of voices) {
                        if (voice.lang.includes('en') && (voice.name.includes('Google') || voice.name.includes('Microsoft') || voice.name.includes('Samantha'))) {
                            selectedVoice = voice;
                            break;
                        }
                    }

                    // Fallback to any English voice
                    if (!selectedVoice) {
                        for (let voice of voices) {
                            if (voice.lang.includes('en')) {
                                selectedVoice = voice;
                                break;
                            }
                        }
                    }

                    // Mark speech as playing
                    this.speechPlaying = true;
                    const callBtn = document.getElementById('callBtn');
                    if (callBtn) callBtn.disabled = true;

                    // Create the utterance
                    const textToSpeak = `${name}, number ${number}`;
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.rate = 1.0;
                    utterance.pitch = 0.9;
                    utterance.volume = 1.0;
                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    }

                    // Handle when speech ends
                    utterance.onend = () => {
                        this.speechPlaying = false;
                        const callBtn = document.getElementById('callBtn');
                        if (callBtn && this.gameRunning && this.calledNumbers.length < this.numbers.length) {
                            callBtn.disabled = false;
                        }
                        console.log('Speech finished');
                    };

                    // Handle errors
                    utterance.onerror = () => {
                        this.speechPlaying = false;
                        const callBtn = document.getElementById('callBtn');
                        if (callBtn && this.gameRunning && this.calledNumbers.length < this.numbers.length) {
                            callBtn.disabled = false;
                        }
                    };

                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.log('Speech synthesis not available:', e);
                    this.speechPlaying = false;
                }
            }

            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }

        // Initialize the app when page loads
        function initializeApp() {
            console.log('Initializing Bingo Caller app...');
            try {
                window.bingoCaller = new BingoCaller();
                console.log('Bingo Caller initialized successfully');
            } catch (error) {
                console.error('Failed to initialize Bingo Caller:', error);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
